# Mật khẩu admin của ArgoCD, lấy từ Secrets Manager thay vì ghi trong values.yaml.
#
# VÌ SAO creationPolicy: Merge chứ không phải Owner (như mọi ExternalSecret khác trong
# dự án này) -- đây là điểm khác biệt thật, không phải sao chép thiếu:
#
# `argocd-secret` KHÔNG chỉ chứa mật khẩu. Nó còn giữ `server.secretkey` (khoá ký phiên
# đăng nhập) và `tls.crt`/`tls.key`, cả ba do chính argocd-server sinh ra lúc chạy chứ
# không phải chart render. Với `Owner`, External Secrets sở hữu toàn bộ secret và xoá
# sạch ba khoá kia. `Merge` chỉ vá đúng hai khoá khai bên dưới.
#
# ⚠️ ĐO ĐƯỢC THẬT 2026-08-25, ĐỪNG BỎ QUA: `Merge` KHÔNG cứu được ba khoá đó khỏi
# `helm upgrade`. Sau khi bỏ mật khẩu ra khỏi values.yaml rồi chạy lại `helm upgrade`,
# Helm render `argocd-secret` theo template và GHI ĐÈ, xoá luôn `server.secretkey` +
# `tls.*` -- log argocd-server hiện `"Unable to parse updated settings: server.secretkey
# is missing"`. ExternalSecret sau đó chỉ ghép lại đúng 2 khoá của nó, không phục hồi
# 3 khoá kia. Pod đang chạy vẫn sống vì còn giữ khoá trong bộ nhớ, nên lỗi này ẩn cho
# tới lần restart tiếp theo -- kiểu hỏng tệ nhất.
#
# Cách chữa: `kubectl rollout restart deployment argocd-server -n argocd`. argocd-server
# tự sinh lại cả ba khoá và ghi vào secret, `admin.password` của ExternalSecret vẫn còn.
# LÀM BƯỚC NÀY sau MỌI lần `helm upgrade` chart argo-cd, không chỉ lần đầu.
#
# HỆ QUẢ CỦA Merge, phải biết trước: secret đích PHẢI tồn tại sẵn. Nghĩa là file này chỉ
# áp được SAU khi `helm upgrade --install argocd` chạy xong (bước 5.11), không phải trước.
# Áp sớm thì ExternalSecret đứng ở trạng thái lỗi "could not get secret data from
# provider" cho tới khi có secret để ghép vào.
#
# `admin.passwordMtime` bắt buộc phải đi kèm: ArgoCD vô hiệu hoá mọi token cấp TRƯỚC mốc
# này. Để mốc cố định trong Secrets Manager (không phải `now`) thì mỗi lần đồng bộ lại
# không đá người đang đăng nhập ra ngoài. Đổi mật khẩu thì nhớ đổi luôn mốc này, nếu không
# token cũ vẫn còn hiệu lực.
#
# Sinh hash mới khi muốn đổi mật khẩu (chạy trên cụm đang sống), rồi put lại vào
# `vox/argocd`, KHÔNG sửa file này:
#   kubectl -n argocd exec deploy/argocd-server -- argocd account bcrypt --password '<mk moi>'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-admin-password
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: admin.password
      remoteRef:
        key: vox/argocd
        property: ADMIN_PASSWORD_BCRYPT
    - secretKey: admin.passwordMtime
      remoteRef:
        key: vox/argocd
        property: ADMIN_PASSWORD_MTIME
